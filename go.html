<!DOCTYPE html>
<html lang="zh-CN" data-build="20260902-focus-fix">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型能力 × opencode Go 可用次数</title>
<style>
  :root{
    --paper:#f7f5f1; --card:#ffffff; --ink:#16181d; --muted:#8a857c;
    --line:#e7e2d9; --green:#16a34a; --accent:#2563eb; --gold:#d9a441;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:34px 36px 60px;}
  /* ---- plan switcher ---- */
  .xswitch{position:sticky;top:10px;z-index:80;display:flex;justify-content:center;margin:0 0 14px;}
  .xswitch .xsbox{display:inline-flex;gap:4px;border:1px solid var(--line);background:rgba(255,255,255,.88);
    backdrop-filter:blur(8px);border-radius:999px;padding:4px;box-shadow:0 4px 16px rgba(30,26,18,.10);}
  .xswitch a{display:inline-flex;align-items:center;border-radius:999px;padding:5.5px 16px;font-size:12.5px;
    color:#8a857c;text-decoration:none;transition:all .15s ease;}
  .xswitch a:hover{color:#3f3b33;background:#f0ebe3;}
  .xswitch a.on{background:#16181d;color:#fff;}
  @media print{.xswitch{display:none}}


  /* ---------- hero ---------- */
  .hero{position:relative;padding:2px 0 18px;}
  .hero::before{content:"";position:absolute;inset:-28px -36px auto -36px;height:110px;pointer-events:none;
    background:
      radial-gradient(560px 190px at 12% 0%, rgba(37,99,235,.09), transparent 70%),
      radial-gradient(520px 180px at 78% 8%, rgba(22,163,74,.10), transparent 70%);}
  .eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.26em;
    color:var(--muted);text-transform:uppercase;margin-bottom:10px;animation:up .6s ease both;}
  .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#2563eb 20%,#16a34a 80%);
    box-shadow:0 0 0 3px rgba(37,99,235,.13);}
  h1{display:none;}
  .sub{color:#78736a;font-size:13.5px;max-width:720px;line-height:1.7;margin:2px 0 0;animation:up .6s ease .12s both;}
  .infoband{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(135deg,rgba(37,99,235,.05),rgba(22,163,74,.04));border:1px solid var(--line);
    border-radius:14px;padding:12px 18px;animation:up .6s ease both;}
  .ib-left{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .ib-badges{display:flex;gap:8px;flex-wrap:wrap;}
  .ib-b{display:inline-flex;align-items:baseline;gap:5px;background:rgba(255,255,255,.75);border:1px solid var(--line);
    border-radius:8px;padding:3px 10px;font-size:12px;color:#57534a;white-space:nowrap;}
  .ib-b b{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .eyebrow{margin-bottom:0;}
  .heroabs{position:static;display:flex;gap:8px;align-items:center;animation:up .6s ease .18s both;flex:none;}
  @media (max-width:760px){.heroabs{position:static;justify-content:flex-start;margin-top:12px;}}
  @media (max-width:760px){.wrap{padding:20px 12px 48px;}.tablecard,.pricecard{padding:6px 12px 10px;border-radius:14px;}}
  .meta-pill{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:7px 16px;font-size:13px;color:#57534a;white-space:nowrap;}
  .langbtn{border:1px solid #cfc8ba;background:#16181d;color:#fff;border-radius:999px;
    padding:7px 18px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .18s ease;}
  .langbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,20,20,.25);}

  /* ---------- insight cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin:26px 0 30px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px 13px;
    box-shadow:0 2px 10px rgba(30,26,18,.04);animation:up .6s ease both;}
  .card:nth-child(1){animation-delay:.20s;border-top:3px solid var(--green);}
  .card:nth-child(2){animation-delay:.26s;border-top:3px solid var(--accent);}
  .card:nth-child(3){animation-delay:.32s;border-top:3px solid #e8590c;}
  .card:nth-child(4){animation-delay:.38s;border-top:3px solid #16181d;}
  .card .cap{font-size:11.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:7px;}
  .card .val{font-family:Georgia,"SimSun",serif;font-size:25px;font-weight:700;line-height:1.15;}
  .card .val small{font-size:14px;font-weight:400;color:#6d685e;margin-left:4px;}
  .card .note{font-size:12.5px;color:#8a857c;margin-top:5px;}
  .cardlink{cursor:pointer;transition:all .18s ease;}
  .cardlink:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,26,18,.10);border-color:#cfc8ba;}

  /* ---------- legend ---------- */
  .legendbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 18px;}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:5.5px 13px;font-size:13px;color:#3f3b33;cursor:pointer;user-select:none;
    transition:all .18s ease;}
  .pill:hover{border-color:#cfc8ba;box-shadow:0 2px 8px rgba(30,26,18,.07);transform:translateY(-1px);}
  .pill.off{opacity:.32;filter:saturate(.2);}
  .lg{position:relative;overflow:visible;width:18px;height:18px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;background:transparent !important;
    align-items:center;justify-content:center;flex:none;}
  .lg i{font-style:normal;font-size:9px;font-weight:700;line-height:1;}
  .lg img{position:static;width:100%;height:100%;object-fit:contain;display:block;background:transparent;}
  .lg.sm{width:14px;height:14px;} .lg.sm i{font-size:8px;}
.lg.ok i{display:none;}
  .lg.noimg{background:var(--lgc,#9ca3af) !important;border-radius:5px;}



  .pill .pdot{width:9px;height:9px;border-radius:50%;}
  .pill .cnt{color:#a39d90;font-size:11.5px;}
  .reset{display:none;border:1px dashed #cfc8ba;background:transparent;border-radius:999px;
    padding:5.5px 13px;font-size:13px;color:#8a857c;cursor:pointer;font-family:inherit;}
  .reset.show{display:inline-flex;}
  .legend-hint{font-size:12.5px;color:#a39d90;margin-left:6px;}

  /* ---------- chart card ---------- */
  .chartcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 12px;
    box-shadow:0 18px 50px rgba(25,22,15,.07);animation:up .7s ease .3s both;}
  .chartbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 14px;flex-wrap:wrap;}
  .bar-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .bar-cap{font-size:11.5px;letter-spacing:.14em;color:var(--muted);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);}
  .seg button{border:0;background:transparent;padding:6px 15px;font-size:12.5px;color:#8a857c;cursor:pointer;
    font-family:inherit;transition:all .15s ease;}
  .seg button.on{background:#16181d;color:#fff;}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 15px;font-size:12.5px;
    color:#3f3b33;cursor:pointer;font-family:inherit;transition:all .18s ease;}
  .btn:hover{border-color:#cfc8ba;box-shadow:0 2px 8px rgba(30,26,18,.08);}
  .syncpill:empty{display:none;}
  .syncpill{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--line);
    background:var(--card);border-radius:999px;padding:5px 14px;font-size:12.5px;color:#3f3b33;max-width:620px;}
  .syncpill.busy{color:#8a857c;}
  .syncpill.ok{border-color:#bbe7c8;background:#f0fbf3;color:#15803d;}
  .syncpill.warn{border-color:#ecd9ae;background:#fdf6e7;color:#8a6413;}
  .syncpill.err{border-color:#e7e2d9;background:var(--card);color:#a39d90;}
  .syncitem{background:rgba(0,0,0,.05);border-radius:6px;padding:2px 8px;white-space:nowrap;}
  .synctime{color:#9aa58f;font-size:11.5px;margin-left:2px;font-variant-numeric:tabular-nums;}
  .syncbtn{border:0;background:#16181d;color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;
    cursor:pointer;font-family:inherit;margin-left:4px;}
  .pchip{display:none;align-items:center;gap:8px;border:1px solid #ecd9ae;background:#fdf6e7;border-radius:999px;
    padding:5px 8px 5px 13px;font-size:12.5px;color:#8a6413;}
  .pchip.show{display:inline-flex;}
  .pchip b{font-weight:600;}
  .pchip button{border:0;background:#f3e4bd;color:#8a6413;width:20px;height:20px;border-radius:50%;
    cursor:pointer;font-size:12px;line-height:1;}
  svg{width:100%;height:auto;display:block;cursor:crosshair;}
  circle.pt{cursor:pointer;}
  svg text{font-family:inherit;}
  .tick{font-size:12.5px;fill:#a39d90;}
  .axis-t{font-size:13.5px;fill:#6d685e;letter-spacing:.05em;}
  .lab{font-size:12.5px;fill:#3f3b33;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;}
  .qlab{font-size:13px;fill:#15803d;font-weight:700;letter-spacing:.06em;paint-order:stroke;stroke:#e8f7ee;stroke-width:4px;}
  .ptg{transform-box:fill-box;transform-origin:center;cursor:pointer;transition:transform .16s ease;
    animation:pop .5s cubic-bezier(.34,1.45,.5,1) both;}
  .ptg .oring{fill:none;opacity:0;stroke:#16181d;stroke-width:2.5;transition:opacity .15s ease;pointer-events:none;}
  .ptg.pin .oring{fill:none;opacity:1;stroke:var(--gold);stroke-width:3;}
  .ptg:hover{transform:scale(1.22);}
  .ptg .lg{width:18px;height:18px;box-shadow:none;background:transparent !important;}
  .ptg .lg.noimg{background:var(--lgc,#9ca3af) !important;border-radius:5px;}
  .ptg .lg i{font-size:9px;}
  .ptg .logo{pointer-events:none;}
  .frontring{fill:none;stroke:var(--gold);stroke-width:2;opacity:.85;pointer-events:none;}
  .rev{transform-box:fill-box;transform-origin:left center;animation:revealX 1.1s cubic-bezier(.4,0,.2,1) .85s both;}
  .fadein{animation:fadein .7s ease both;}
  .noanim *{animation:none!important;transition:none!important;}
  .xhair{pointer-events:none;}
  .chipbox{fill:#16181d;}
  .chiptxt{font-size:11.5px;fill:#fff;font-weight:600;}

  /* ---------- no-score lane ---------- */
  .nslane-cap{font-size:11.5px;fill:#a39d90;}
  .ptg.ns .lg{width:18px;height:18px;}
  .nsname{font-size:11.5px;fill:#6d685e;font-weight:600;paint-order:stroke;stroke:#f7f5f1;stroke-width:3px;}
  .nsname .nsv{fill:#a39d90;font-weight:400;font-size:11px;}

  /* ---------- tooltip ---------- */
  #tt{position:fixed;display:none;pointer-events:none;z-index:60;width:262px;
    background:#16181d;color:#f4f2ee;border-radius:13px;padding:13px 15px 14px;
    box-shadow:0 14px 40px rgba(10,10,14,.35);font-size:12.5px;line-height:1.5;}
  #tt .ttname{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  #tt .ttname .pdot{width:9px;height:9px;border-radius:50%;flex:none;}
  #tt .ttven{color:#9b958a;font-size:11.5px;margin-bottom:9px;}
  #tt .row{display:flex;justify-content:space-between;margin-top:6px;}
  #tt .row b{font-variant-numeric:tabular-nums;}
  #tt .bar{height:4px;background:#33352f;border-radius:2px;margin-top:3px;overflow:hidden;}
  #tt .bar i{display:block;height:100%;border-radius:2px;}
  #tt .badges{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;}
  #tt .bdg{font-size:10.5px;border:1px solid #4a4c44;border-radius:999px;padding:2px 9px;color:#d8d4cb;}
  #tt .bdg.g{border-color:#2f7d4f;color:#7fd6a2;}
  #tt .bdg.gold{border-color:#8a6413;color:#ecc978;}
  #tt .cmp{border-top:1px dashed #4a4c44;margin-top:10px;padding-top:8px;}
  #tt .cmp .cmp-t{font-size:10.5px;letter-spacing:.12em;color:#9b958a;margin-bottom:2px;}
  #tt .up{color:#7fd6a2;} #tt .dn{color:#f0a08c;}
  #tt .cmpnote{margin-top:7px;font-size:11.5px;color:#c9c4ba;}

  /* ---------- table ---------- */
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:22px;
    padding:6px 20px 10px;box-shadow:0 8px 30px rgba(25,22,15,.05);overflow:hidden;}
  table{border-collapse:collapse;width:100%;font-size:13.5px;table-layout:fixed;}
  #tbl,#ptbl{min-width:720px;}
  /* 统一网格：两表共用 6 列宽度，垂直扫视对齐 */
  /* 两表共用列宽: 保证上下表列线垂直对齐 */

  #tbl th:nth-child(1),#ptbl th:nth-child(1){width:440px;}
  #tbl th:nth-child(2),#ptbl th:nth-child(2){width:145px;}
  #tbl th:nth-child(3),#ptbl th:nth-child(3){width:130px;}
  #tbl th:nth-child(4),#ptbl th:nth-child(4){width:145px;}
  #tbl th:nth-child(5),#ptbl th:nth-child(5){width:145px;}
  #tbl th:nth-child(6),#ptbl th:nth-child(6){width:105px;}
  thead th{font-size:11px;letter-spacing:.13em;color:#a39d90;font-weight:600;text-align:center;
    padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;}
  thead th:first-child{text-align:left;}
  thead th.sortable{cursor:pointer;}
  thead th.sortable:hover{color:#6d685e;}
  thead th .arr{color:var(--gold);font-size:10px;margin-left:3px;}
  thead th.active-col{color:#16181d;}
  tbody td{padding:8px 4px;border-bottom:1px solid #f1eee7;font-variant-numeric:tabular-nums;}
  tbody tr{transition:background .12s ease;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:#fbfaf7;}
  tbody tr:hover,tbody tr.hl{background:#f3f7f2;}
  tbody tr.pinrow{background:#fdf6e7!important;}
  tbody tr.dim2{opacity:.3;}
  .ctx{display:inline-block;font-size:11px;color:#a39d90;background:#f0ebe3;border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.tier-sub td{border-top:none!important;padding-top:4px!important;padding-bottom:4px!important;background:#faf8f5;}
.tier-first td{border-bottom:none!important;}
.tier-ctx{font-size:12px;color:#6d685e;}
.ptg.dimmed{opacity:.35!important;}
  .ptg.dimmed .oring{opacity:0!important;}
  tbody td:first-child{text-align:left;}
  th.num,td.num{text-align:center;}
  
  td .lg{margin-right:8px;vertical-align:-3px;}
  .mk{color:var(--green);font-weight:700;} .mkno{color:#ddd8cd;}
  .mm-tag{color:#a39d90;font-size:11px;}

  .pricecard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:22px;
    padding:6px 20px 10px;box-shadow:0 8px 30px rgba(25,22,15,.05);overflow:hidden;}
  .tablecard,.pricecard{overflow-y:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .pricecap{font-size:11.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:10px;}
  .pc{color:#6d685e;} .pc b{color:var(--ink);font-weight:700;}
  .pr-pill{display:inline-block;border:1px solid #cfe4d6;background:#f0fbf3;border-radius:999px;
    padding:2px 11px;font-size:12.5px;color:#15803d;white-space:nowrap;}
  .pr-pill.gold{border-color:#ecd9ae;background:#fdf6e7;color:#8a6413;}
  .foot{color:#a39d90;font-size:12.5px;line-height:1.8;margin:18px 4px 0;}
.foot a{color:#2563eb;text-decoration:none;border-bottom:1px solid rgba(37,99,235,.25);transition:border-color .15s;}
  .foot a:hover{border-bottom-color:#2563eb;}
  .footsynctime{color:#9aa58f;font-size:11.5px;margin-left:4px;font-variant-numeric:tabular-nums;}
  .foot b{color:#6d685e;}

  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  @keyframes revealX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ================= POLISH LAYER (2026-09-04 visual refinement, CSS-only) ================= */
  /* -- 圆角体系统一：卡片 16px / 控件 10px / 胶囊保持全圆 -- */
  .chartcard,.tablecard,.pricecard{border-radius:16px;}
  .seg,.btn{border-radius:10px;}

  /* -- 4/8px 间距节奏 -- */
  .wrap{padding:32px 36px 64px;}
  .legendbar{gap:8px;margin:16px 0 20px;}
  .chartcard{padding:20px 24px 16px;}
  .chartbar{margin:0 2px 16px;}
  .tablecard,.pricecard{margin-top:24px;padding:8px 24px 12px;}
  thead th{padding:11px 6px 9px;}
  tbody td{padding:9px 5px;}
  .foot{margin:20px 4px 0;}

  /* -- 字阶微调（对齐 4px 栅格） -- */
  .card .val{font-size:24px;}
  .card .cap{letter-spacing:.16em;}
  .btn,.seg button{padding:7px 16px;}

  /* -- 质感：双层克制阴影（贴地影 + 柔和扩散影），替代原有三种深浅 -- */
  .chartcard{box-shadow:0 1px 2px rgba(30,26,18,.04),0 16px 40px rgba(25,22,15,.06);}
  .tablecard,.pricecard{box-shadow:0 1px 2px rgba(30,26,18,.03),0 8px 24px rgba(25,22,15,.05);}

  /* -- 交互补全：键盘焦点环 / 按压反馈 / 同步按钮 hover -- */
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn:active,.seg button:active,.pill:active,.langbtn:active,.syncbtn:active,.reset:active{
    transform:translateY(1px) scale(.98);}
  .syncbtn{transition:opacity .15s ease;}
  .syncbtn:hover{opacity:.85;}

  /* -- 细节：文字选中色 -- */
  ::selection{background:rgba(37,99,235,.16);}
  @media (max-width:900px){#tbl,#ptbl{table-layout:fixed;width:560px;min-width:560px;}#tbl th:nth-child(1),#ptbl th:nth-child(1){width:190px;}#tbl th:nth-child(2),#ptbl th:nth-child(2){width:75px;}#tbl th:nth-child(3),#ptbl th:nth-child(3){width:65px;}#tbl th:nth-child(4),#ptbl th:nth-child(4){width:75px;}#tbl th:nth-child(5),#ptbl th:nth-child(5){width:80px;}#tbl th:nth-child(6),#ptbl th:nth-child(6){width:75px;}}}
</style>
</head>
<body>
<div class="wrap"><div class="xswitch"><span class="xsbox"><a class="" href="/plan/goat/" id="xsGoat">GOAT 计划</a><a class="on" href="/plan/go/" id="xsGo">Go 计划</a></span></div>
  <div class="hero">
    <div class="infoband">
      <div class="ib-left">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="ib-badges" id="ibBadges"></div>
      </div>
      <div class="heroabs">
        <div class="meta-pill" id="metaPill"></div>
        <button class="langbtn" id="langBtn"></button>
      </div>
    </div>
  </div>

  <div class="legendbar" id="legendbar"></div>

  <div class="chartcard">
    <div class="chartbar">
      <div class="bar-l">
        <span class="bar-cap" id="capMetric"></span>
        <span class="seg" id="segMetric">
          <button data-m="h5"></button><button data-m="wk"></button><button data-m="mo"></button>
        </span>
        <span class="bar-cap" id="capAxis"></span>
        <span class="seg" id="segAxis">
          <button data-m="log"></button><button data-m="lin"></button>
        </span>
        <span class="pchip" id="pchip"></span>
      </div>
      <span class="syncpill" id="sync"></span>
      <button class="btn" id="btnExport"></button>
    </div>
    <div id="chart"></div>
  </div>

  <div class="tablecard">
    <table id="tbl">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pricecard">
    <div class="pricecap" id="priceCap"></div>
    <table id="ptbl"><thead id="pthead"></thead><tbody id="ptbody"></tbody>    </table>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div id="tt"></div>

<script>
/* ================= DATA ================= */

function logoHTML(c,white){
  const co=COMPANIES[c]; if(!co)return"";
  if(co.aa && AA[co.aa]) return `<span class="lg ok"><img src="${AA[co.aa]}" alt="" onerror="this.parentNode.classList.remove(\'ok\')"><i style="color:${co.color}">${co.ch}</i></span>`;
  return `<span class="lg noimg" style="--lgc:${co.color};background:${co.color}"><i style="color:#fff">${co.ch}</i></span>`;
}
function vendorForName(nm){
  const k=(nm||"").toLowerCase();
  if(/mimo|mi-mo|mi mo/.test(k)) return "xiaomi";
  if(/deepseek/.test(k)) return "deepseek";
  if(/muse\s*spark|muse/i.test(k)) return "muse";
  if(/tencent|hy\d|hunyuan/.test(k)) return "tencent";
  if(/qwen|tongyi|千问/.test(k)) return "qwen";
  if(/glm|z\.?ai|智谱/.test(k)) return "zai";
  if(/gpt|openai|o1|o3|o4/.test(k)) return "openai";
  if(/minimax/.test(k)) return "minimax";
  if(/step/.test(k)) return "step";
  if(/gemini|google/.test(k)) return "google";
  if(/kimi|moonshot/.test(k)) return "kimi";
  if(/inkling|thinking/i.test(k) && !/gpt|glm|qwen|kimi|deepseek|grok|gemini/.test(k)) return "inkling";
  if(/nemotron|nvidia/.test(k)) return "nvidia";
  if(/grok|xai/.test(k)) return "xai";

const METRICS={h5:{f:"req",zone:1000},wk:{f:"wk",zone:2500},mo:{f:"mo",zone:5000}};

const rankS={}, rankR={};
function computeDerived(){
  const f=METRICS[METRIC].f, zone=METRICS[METRIC].zone;
  const rows=DATA.filter(d=>d[f]!=null&&d[f]>0);
  frontier=[]; let mxc=-1;
  [...rows].sort((a,b)=>b[f]-a[f]||(b.s||0)-(a.s||0)).forEach(d=>{ if(d.s!=null&&!d.inherited&&(d.s||0)>mxc){frontier.push(d); mxc=d.s||0;} });
  onP=new Set(frontier.map(d=>d.n));
  maxScore=Math.max(...DATA.map(d=>d.s||0));
  maxReq=Math.max(...rows.map(d=>d[f]));
  bestDual=DATA.filter(d=>d[f]>=zone&&d.s!=null&&d.s>=45).sort((a,b)=>b.s-a.s)[0]||null;
  [...DATA].sort((a,b)=>(b.s||0)-(a.s||0)).forEach((d,i)=>{rankS[d.i]=d.s==null?0:i+1;});
  [...rows].sort((a,b)=>b[f]-a[f]).forEach((d,i)=>{rankR[d.i]=i+1;});
}

const W=1180,L=86,T=34,R=48,PW=W-L-R,PH=560;
const YMIN=15,YMAX=55;
const Y=s=>T+(YMAX-s)/(YMAX-YMIN)*PH;
const R_PT=7;
const LAB={
 "Muse Spark 1.3 Contributor":[-8,14,"end"], "DUMMY-NEVER-MATCHES":[0,0,"middle"],
 "Qwen 3.8 Flash":[-10,12,"end"], "DeepSeek V4 Flash":[-10,12,"end"], "DeepSeek V4 Flash (latest)":[-10,12,"end"], "DeepSeek V4 Flash Vision (exp)":[10,-10,"start"],
 "Muse Spark 1.2 Contributor":[-10,-12,"end"], "MiMo V2.5":[-10,6,"end"]
};
let mode="log", firstDraw=true, svg=null, pinned=-1, LAST_H=760;
function geom(m){
  const f=METRICS[m].f;
  const vals=DATA.map(d=>d[f]).filter(v=>v>0);
  if(mode==="lin"){
    const XMIN=0,XMAX=Math.max(...vals)*1.06;
    const step=Math.pow(10,Math.floor(Math.log10(XMAX/5)));
    const ticks=[]; for(let v=0;v<=XMAX+step;v+=step)ticks.push(v);
    return {XMIN:0,XMAX,ticks,
      X:v=>L+(v-XMIN)/(XMAX-XMIN)*PW,
      xVal:px=>(px-L)/PW*(XMAX-XMIN),
      tfmt:x=>x===0?"0":x>=1000?(x/1000)+"k":String(x)};
  }
  const XMIN=Math.min(...vals)*0.85, XMAX=Math.max(...vals)*1.12;
  const L0=Math.log10(XMIN),L1=Math.log10(XMAX);
  const cand=[100,200,300,500,1000,2000,3000,5000,10000,20000,30000,50000,100000];
  const ticks=cand.filter(x=>x>=XMIN*0.9&&x<=XMAX);
  return {XMIN,XMAX,ticks,
    X:v=>L+(Math.log10(v)-L0)/(L1-L0)*PW,
    xVal:px=>Math.pow(10,L0+(px-L)/PW*(L1-L0)),
    tfmt:x=>x>=1000?(x/1000)+"k":String(x)};
}
function drawChart(){
  const g=geom(METRIC), zone=METRICS[METRIC].zone;
  const lane=DATA.filter(d=>d.s==null&&vf(d)!=null);
  const laneH=lane.length?76:0;
  const S=[];
  const H=T+PH+laneH+46; LAST_H=H;
  S.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"${firstDraw?"":' class="noanim"'}>`);
  S.push(`<defs>
    <pattern id="micro" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.1" fill="#e7e2d6"/></pattern>
    <clipPath id="reveal"><rect class="rev" x="${L}" y="${T-2}" width="${PW}" height="${PH+4}"/></clipPath>
  </defs>`);
  S.push(`<rect class="fadein" x="${L}" y="${T}" width="${PW}" height="${PH+laneH}" fill="url(#micro)"/>`);

  for(const x of g.ticks)S.push(`<line x1="${g.X(x)}" y1="${T}" x2="${g.X(x)}" y2="${T+PH}" stroke="#eee9df"/>`);
  for(let gy=15;gy<=55;gy+=5)S.push(`<line x1="${L}" y1="${Y(gy)}" x2="${L+PW}" y2="${Y(gy)}" stroke="#eee9df"/>`);
  S.push(`<rect x="${L}" y="${T}" width="${PW}" height="${PH+laneH}" fill="none" stroke="#ddd6c9" rx="10"/>`);
  const fAsc=[...frontier].reverse();
  S.push(`<g clip-path="url(#reveal)"><polyline points="${fAsc.map(d=>g.X(vf(d))+","+Y(d.s)).join(" ")}"
    fill="none" stroke="#2f2f33" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 8.5" opacity=".82"/></g>`);
  for(const x of g.ticks)
    S.push(`<text class="tick" x="${g.X(x)}" y="${T+PH+24}" text-anchor="middle">${g.tfmt(x)}</text>`);
  for(let v=20;v<=55;v+=5)
    S.push(`<text class="tick" x="${L-12}" y="${Y(v)+4.5}" text-anchor="end">${v}</text>`);
  S.push(`<text class="axis-t" x="${L+PW/2}" y="${T+PH+laneH+34}" text-anchor="middle">${mode==="log"?t("xAxis")(METRIC):t("xAxisLin")(METRIC)}</text>`);
  S.push(`<text class="axis-t" x="26" y="${T+PH/2}" text-anchor="middle" transform="rotate(-90 26 ${T+PH/2})">${t("yAxis")}</text>`);
  // 无分数滑槽：绘图区底边向下延长一块，清晰分界线隔开有分/无分，icon 沿同一横轴滑动对比次数
  const laneY=T+PH+54;
  if(lane.length){
    // 与绘图区同底纹、同外框，只以一条温和灰线分界
    S.push(`<line x1="${L}" y1="${T+PH}" x2="${L+PW}" y2="${T+PH}" stroke="#b9b2a2" stroke-width="1.2"/>`);
    lane.forEach(d=>{
      const cx=Math.max(L+12, Math.min(L+PW-12, g.X(vf(d))));
      S.push(`<g class="ptg ns" data-i="${d.i}">
        <line x1="${cx}" y1="${T+PH}" x2="${cx}" y2="${laneY-12}" stroke="#c9c2b2" stroke-width="1"/>
        <circle cx="${cx}" cy="${T+PH}" r="2.4" fill="#6d685e" opacity=".55"/>
        <foreignObject x="${cx-9}" y="${laneY-9}" width="18" height="18">${logoHTML(d.c)}</foreignObject>
        <circle class="pt" data-i="${d.i}" cx="${cx}" cy="${laneY}" r="13" fill="transparent"/>
      </g>`);
    });
  }
  DATA.forEach((d,i)=>{
    if(d.req==null||d.s==null)return;
    const cx=g.X(vf(d)), cy=d.s==null?Y(YMIN):Y(d.s);
    S.push(`<g class="ptg${d.i===pinned?" pin":""}" data-i="${i}" style="animation-delay:${(i*16+300)}ms">
      <circle class="oring" cx="${cx}" cy="${cy}" r="10.5"/>
      <foreignObject x="${cx-9}" y="${cy-9}" width="18" height="18">${logoHTML(d.c)}</foreignObject>
      <circle class="pt" data-i="${i}" cx="${cx}" cy="${cy}" r="13" fill="transparent"/>
    </g>`);
  });
  // 标签跟随当前帕累托前沿，保证 每5小时/每周/每月 三档统一显示（有环即有字，无环即无字）
  frontier.filter(d=>d.n && !d.n.includes("${")).forEach(d=>{
    let lb2=LAB[d.n];
    let dx,dy,a;
    if(lb2){ [dx,dy,a]=lb2; }
    else {
      // 未在 LAB 预设的前沿成员，自动摆在点上方，底部低分点摆下方，靠边时自动翻锚点防溢出
      dy = (d.s!=null && d.s<35) ? 12 : -12;
      dx = 0; a="middle";
      const cx=g.X(vf(d));
      if(cx > L+PW-90){ a="end"; dx=-8; }
      else if(cx < L+90){ a="start"; dx=8; }
    }
    S.push(`<text class="lab" x="${g.X(vf(d))+dx}" y="${(d.s==null?Y(YMIN):Y(d.s))+dy}" text-anchor="${a}">${esc(d.n)}</text>`);
  });
  S.push(`<g class="xhair" id="xh" style="display:none">
    <line id="xhV" y1="${T}" y2="${T+PH}" stroke="#b9b2a2" stroke-dasharray="3 4"/>
    <line id="xhH" x1="${L}" x2="${L+PW}" stroke="#b9b2a2" stroke-dasharray="3 4"/>
    <g id="xc"><rect class="chipbox" rx="4" height="18"/><text class="chiptxt" text-anchor="middle"></text></g>
    <g id="yc"><rect class="chipbox" rx="4" height="18"/><text class="chiptxt" text-anchor="middle"></text></g>
  </g>`);
  S.push(`</svg>`);
  document.getElementById("chart").innerHTML=S.join("");
  svg=document.querySelector("#chart svg");
}

function parseDoc(html){
  const i=html.indexOf("Requests / 5 hours"); if(i<0)return null;
  const seg=html.slice(Math.max(0,i-2000), i+40000);
  const est={}; const rowRe=/<tr[^>]*>([\s\S]*?)<\/tr>/g; let m;
  while((m=rowRe.exec(seg))){
    const cellRe=/<td[^>]*>([\s\S]*?)<\/td>/g; const cells=[]; let c;
    while((c=cellRe.exec(m[1])))cells.push(c[1].replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim());
    if(cells.length<4)continue;
    const nums=cells.slice(1,4).map(x=>x.replace(/,/g,"").trim());
    if(!nums.every(x=>/^\d+$/.test(x)))continue;
    if(cells[0]&&!(cells[0] in est))est[cells[0]]=nums.map(Number);
  }
  // 模型表顺序：最新加入排最上
  let j=html.indexOf("Every model below is included");
  const order=[];
  if(j>=0){
    let end=html.indexOf('id="usage-limits"', j); if(end<0)end=j+150000;
    const seg2=html.slice(j, end);
    const row2=/<tr[^>]*>([\s\S]*?)<\/tr>/g; let m2;
    while((m2=row2.exec(seg2))){
      const a=/<a[^>]*>([\s\S]*?)<\/a>/.exec(m2[1]);
      if(!a)continue;
      const nm=a[1].replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
      if(nm&&!order.includes(nm))order.push(nm);
    }
  }
  let ci=html.indexOf("Monthly credits");
  const cr={};
  while(ci>=0){
    const seg3=html.slice(ci, ci+20000);
    const row3=/<tr[^>]*>([\s\S]*?)<\/tr>/g; let m3;
    while((m3=row3.exec(seg3))){
      const cell3=/<td[^>]*>([\s\S]*?)<\/td>/g; const cs=[]; let c3;
      while((c3=cell3.exec(m3[1])))cs.push(c3[1].replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim());
      if(cs.length<6)continue;
      const name3=cs[0];
      if(!name3||/^[\$\d]/.test(name3))continue;
      const money=cs.slice(1,6).map(x=>/^[-—]$|^[-—]?[\$\d,.]+$/.test(x)?x:null);
      if(money.every(x=>x!==null)&&!(name3 in cr))cr[name3]=money;
    }
    const ci2=html.indexOf("Monthly credits", ci+10);
    if(ci2<0||ci2-ci>60000)break;
    ci=ci2;
  }
  return Object.keys(est).length?{est,order,cr}:null;
}

      d.req=doc.est[hit][0]; d.wk=doc.est[hit][1]; d.mo=doc.est[hit][2];
    }
    const crk=doc.cr&&Object.keys(doc.cr).find(k=>nameEq(k,d.n));
    if(crk)d.pr=doc.cr[crk];
    if(d.c==="NEW"){ const vc=vendorForName(d.n); if(vc!=="NEW")d.c=vc; }
  });
  // AA agentic 分数合并（fetch_go 抓取）；新分数进来的不进帕累托前沿的老逻辑保持不变
  const sc=doc.scores||{};
  DATA.forEach(d=>{
    const k=Object.keys(sc).find(k=>nameEq(k,d.n));
    if(k&&sc[k]!=null)d.s=sc[k];
  });
  variantInherit();
  return true;
}
async function loadServerCache(){
  try{
    const r=await fetch(CACHE_URL+"?t="+Date.now(), {cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const doc=await r.json();
    if(applyServerData(doc)){
      computeDerived(); applyLang();
      const st=document.getElementById("sync");
      if(st){
        SYNC={state:"ok"};
        st.innerHTML=t("syncOk")+` <span class="synctime">${t("syncAt")}${esc(doc.updated||"—")}</span>`;
        st.className="syncpill ok";
      }
      return true;
    }
  }catch(e){ console.warn("cache load failed:", e); }
  return false;
}
/* 管理员一键同步：POST 到服务器鉴权端点，成功后重新拉缓存 */
async function adminSync(){
  const st=document.getElementById("sync");
  const set=(h,cls)=>{st.innerHTML=h; st.className="syncpill "+(cls||"");};
  set(t("syncCheck"),"busy");
  try{
    const r=await fetch("/plan/api/sync", {method:"POST", headers:{"X-Token":ADMIN_TOKEN}});
    const j=await r.json();
    if(r.status===403){ set(LANG==="zh"?"无权限 / forbidden":"forbidden","err"); return false; }
    if(!j.ok){ set((LANG==="zh"?"同步失败: ":"sync failed: ")+(j.output||j.error||"?").slice(-120),"err"); return false; }
    SYNC={state:"ok"};
    set(LANG==="zh"?"✓ 已同步官方 · 数据为最新":"✓ Synced with official docs","ok");
    await loadServerCache();
    // loadServerCache 为非管理员才会覆写胶囊；管理员保持 ok 态，避免 applyLang → renderSync 因 SYNC 仍为 idle 而清空
    SYNC={state:"ok"};
    return true;
  }catch(e){
    set((LANG==="zh"?"同步失败: ":"sync failed: ")+e,"err"); return false;
  }
}

function checkOfficial(silent){
  /* Cache-First：浏览器绝不直接请求官方接口。管理员按钮由 boot 段注入。 */
  if(!IS_ADMIN())return;
  SYNC={state:"admin"}; renderSync();
}
function renderAdminPill(){
  const st=document.getElementById("sync");
  if(!IS_ADMIN()){return;}
  st.className="syncpill";
  st.innerHTML=`<span class="syncitem">管理员模式</span><button class="syncbtn" id="syncGoat">${t("syncUpdate")}</button>`;
}
document.addEventListener("click",async e=>{
  if(e.target.id!=="syncGoat")return;
  const ok=await adminSync();
  if(ok){computeDerived();applyLang();}
});
function checkOfficial_old(silent){
  SYNC={state:"busy"}; renderSync();
  fetch(DOC_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>{
    if(!r.ok)throw new Error("HTTP "+r.status); return r.text();
  }).then(html=>{
    const doc=parseDoc(html);
    if(!doc){SYNC={state:"err"}; renderSync(); return;}
    store.set({t:Date.now()});
    const pos={}; doc.order.forEach((n,i)=>{ if(pos[n]===undefined)pos[n.toLowerCase()]=i; });
    const knownPos=DATA.map(d=>{
      const k=Object.keys(pos).find(k2=>nameEq(k2,d.n)||k2===d.n.toLowerCase());
      return k!==undefined?pos[k]:null;
    }).filter(v=>v!==null);
    const minKnown=knownPos.length?Math.min(...knownPos):0;
    const diffs=[],news=[];
    DATA.forEach(d=>{
      const hit=Object.keys(doc.est).find(k=>nameEq(k,d.n));
      if(!hit){diffs.push({n:d.n,type:"gone"});return;}
      const crHit=doc.cr&&Object.keys(doc.cr).find(k=>nameEq(k,d.n));
      const oldCr=crHit?doc.cr[crHit]:null;
      const reqChanged=doc.est[hit][0]!==d.req;
      const priceChanged=!!(d.pr&&oldCr&&(oldCr[0]!==d.pr[0]||oldCr[1]!==d.pr[1]||oldCr[4]!==d.pr[4]));
      if(reqChanged||priceChanged)
        diffs.push({n:d.n,type:"chg",old:d.req,now:doc.est[hit][0],cr:oldCr,onlyCr:!reqChanged});
    });
    doc.order.forEach(k=>{
      if(DATA.some(d=>nameEq(k,d.n)))return;
      const p=Object.keys(pos).find(k2=>nameEq(k2,k)||k2===k.toLowerCase());
      const hasQuota=!!Object.keys(doc.est).find(k2=>nameEq(k2,k));
      // 两条触发线：①排位高于所有已知（最新加入）②有额度估算但完全不在本地（变体/新档位）
      if(!(p!==undefined && pos[p]<minKnown) && !(hasQuota && p!==undefined))return;
      const hit=Object.keys(doc.est).find(k2=>nameEq(k2,k));
      const crHit2=doc.cr&&Object.keys(doc.cr).find(k2=>nameEq(k2,k));
      news.push({n:k,req:hit?doc.est[hit][0]:null,cr:crHit2?doc.cr[crHit2]:null});
    });
    window.__goatDiffs=diffs; window.__goatNews=news; window.__goatDoc=doc;
    if(!diffs.length&&!news.length){SYNC={state:"ok"}; renderSync(); return;}
    SYNC={state:"warn",diffs,news}; renderSync();
  }).catch(()=>{
    SYNC={state:"err"}; renderSync();
  });
}
document.addEventListener("click",e=>{
  if(e.target.id!=="syncGoat")return;
  const diffs=window.__goatDiffs||[], news=window.__goatNews||[], doc=window.__goatDoc;
  if(!doc)return;
  diffs.forEach(x=>{
    const d=DATA.find(d=>nameEq(d.n,x.n)); if(!d)return;
    if(x.type==="chg"){
      const hit=Object.keys(doc.est).find(k=>nameEq(k,x.n));
      if(hit){d.wk=doc.est[hit][1];d.mo=doc.est[hit][2];}
      d.req=hit?doc.est[hit][0]:x.now;
      if(x.cr)d.pr=x.cr;
      savePatch({n:d.n,req:d.req,wk:d.wk,mo:d.mo,pr:d.pr});
    }
  });
  news.forEach(x=>{
    const hit=Object.keys(doc.est).find(k=>nameEq(k,x.n));
    const hasQ=!!hit;
    const vc=vendorForName(x.n);
    const row={n:x.n,req:hasQ?x.req:null,s:null,c:vc,pr:x.cr||null,
      wk:hasQ?doc.est[hit][1]:0,mo:hasQ?doc.est[hit][2]:0,i:DATA.length};
    if(hasQ){row.wk=doc.est[hit][1];row.mo=doc.est[hit][2];}
    DATA.push(row);
    savePatch(row);
  });
  pinned=-1;
  if(!ORDER.includes("NEW"))ORDER.push("NEW");
  DATA.forEach(d=>{
    if(d.c==="NEW"){
      const vc=vendorForName(d.n);
      if(vc!=="NEW"){ d.c=vc; }
    }
  });
  // Speed 变体（官方文档："Speed variants are separate models with their own credits"，
  // 且记分列 not yet scored）——继承基础模型的 Intelligence 分数，图/表按同能力处理
  DATA.forEach(d=>{
    if(d.s==null && d.c!=="NEW"){
      const base=d.n.replace(/\s*(Fast|HighSpeed|Contributor)\s*$/i,"").trim();
      const baseStripped=base.replace(/\s*\(latest\)|\s*\(exp\)/gi,"").trim();
      let twin=DATA.find(o=>o!==d && o.s!=null &&
        (nameEq(o.n,base)||nameEq(o.n,baseStripped)||nameEq(o.n.replace(/\s*\(latest\)|\s*\(exp\)/gi,"").trim(),baseStripped)));
      if(!twin && d.n==="DeepSeek V4 Flash Fast"){ twin=DATA.find(o=>o.n==="DeepSeek V4 Flash (latest)"&&o.s!=null)||DATA.find(o=>o.s!=null&&/deepseek.*flash/i.test(o.n)); }
      if(twin){ d.s=twin.s; d.inherited=twin.n; }
    }
  });
  computeDerived();
  applyLang();
  checkOfficial(true);
});
